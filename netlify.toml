[build]
  # 指定建置命令
  command = "npm run build"
  
  # 指定發布目錄（Vite 預設輸出到 dist 目錄）
  publish = "dist"

[build.environment]
  # 指定 Node.js 版本
  NODE_VERSION = "18"

# 處理 SPA 路由，將所有路由重定向到 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 設定快取標頭以優化效能
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 安全標頭
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"